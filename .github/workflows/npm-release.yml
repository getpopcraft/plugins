# Publish @popcraft/plugins to npmjs when a release is promoted from prerelease.
#
# AUTH: OIDC trusted publishing — no NPM_TOKEN. One-time setup on npmjs.com, after the first
# manual publish:
#   Organization or user: getpopcraft
#   Repository:           plugins
#   Workflow filename:    npm-release.yml
#   Environment:          (leave blank)
# Requires npm >= 11.5.1 and id-token: write.

name: NPM release

on:
  release:
    types: [published, edited]

jobs:
  publish:
    name: Publish packages
    # Promote path: a full release (not a draft, not a prerelease).
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Do NOT set registry-url — it injects a dummy NODE_AUTH_TOKEN that
          # breaks npm OIDC trusted publishing (E404 on PUT).

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: |
          npm install -g "npm@^11"
          npm --version

      - name: Skip if this version is already on npm
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@popcraft/plugins@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@popcraft/plugins@$VERSION is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build
        if: steps.gate.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: Pack
        if: steps.gate.outputs.published == 'false'
        # prepack compiles the runtime and the declarations into dist/.
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npmjs
        if: steps.gate.outputs.published == 'false'
        env:
          # Ensure token auth cannot shadow OIDC (setup-node / secrets leftovers).
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No GitHub OIDC token endpoint — check permissions.id-token: write"
            exit 1
          fi
          TARBALL=$(ls "$RUNNER_TEMP"/*.tgz)
          # Provenance is on: unlike the tish tarball flow, this tarball is built in this job
          # from this tag, which is exactly the case provenance attests. Set
          # NPM_CONFIG_PROVENANCE=false here if npm ever rejects it.
          npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/
