# Conventional commits on main -> next version via sem -> tag + GitHub prerelease.
# Promote that release (uncheck "Set as a pre-release") and npm-release.yml publishes
# both packages to npm over OIDC. Same promote-style flow as tishlang/tish and tishlang/sem.

name: Release (prerelease)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Tag and prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

      - name: Next version via sem (dry-run)
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches:
              - main
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump — nothing to release."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"

      - name: Set both package versions
        if: steps.gate.outputs.continue == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          # Both packages move together: plugin-examples depends on plugin-typings,
          # and one version for "the examples" is what the docs cite.
          for dir in packages/plugin-typings packages/examples; do
            node -e "
              const fs = require('fs');
              const f = '$dir/package.json';
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            "
          done
          pnpm install --lockfile-only

      - name: Commit the version bump
        if: steps.gate.outputs.continue == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "chore(release): v${VERSION} [skip ci]" || true
          git push origin HEAD:main

      - name: Tag + GitHub prerelease via sem
        if: steps.gate.outputs.continue == 'true'
        uses: tishlang/sem@v1
        with:
          force: ${{ steps.gate.outputs.version }}
          config: |
            branches:
              - main
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - ["@sem/github", { "prerelease": true }]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
