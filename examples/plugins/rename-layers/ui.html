<!doctype html>
<html>
<head>
  <style>
    /* The editor writes its theme into this panel as --pc-* variables (and styles body, inputs and buttons
       to match), so only layout lives here. The fallbacks keep it readable outside PopCraft. */
    label { display: block; margin-bottom: 8px; color: var(--pc-fg-muted, #666); }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; }
    #count { color: var(--pc-fg-subtle, #666); }
    .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    button { padding: 6px 12px; }
    button.primary { background: var(--pc-accent, #0c8ce9); color: var(--pc-fg-on-accent, #fff); border-color: var(--pc-accent, #0c8ce9); }
  </style>
</head>
<body>
  <label>Pattern <input id="pattern" value="Layer #"></label>
  <label>Start at <input id="start" type="number" value="1"></label>
  <div id="count">No selection</div>
  <div class="row">
    <button id="cancel">Close</button>
    <button id="rename" class="primary">Rename</button>
  </div>
  <script>
    popcraft.onmessage = function (msg) {
      if (msg.type === 'selection') {
        document.getElementById('count').textContent = msg.count ? msg.count + ' layer(s) selected' : 'No selection'
        if (msg.pattern && !window.__patternSet) { document.getElementById('pattern').value = msg.pattern; window.__patternSet = true }
      }
    }
    document.getElementById('rename').onclick = function () {
      popcraft.postMessage({ type: 'rename', pattern: document.getElementById('pattern').value, start: document.getElementById('start').value })
    }
    document.getElementById('cancel').onclick = function () { popcraft.postMessage({ type: 'cancel' }) }
    popcraft.postMessage({ type: 'ready' })
  </script>
</body>
</html>
